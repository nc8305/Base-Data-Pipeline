services:
  # ==========================================
  # 1. MESSAGE QUEUE (Apache Kafka KRaft Mode)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: hpc-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  # ==========================================
  # 2. STREAM PROCESSING (Apache Flink Cluster)
  # ==========================================
  jobmanager:
    image: flink:1.18.1-java11
    container_name: flink-jobmanager
    ports:
      - "8081:8081" # Flink Web UI
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

  taskmanager:
    image: flink:1.18.1-java11
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 2 # Scale to 2 instances to simulate distributed processing
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4 # 4 slots per TaskManager

  # ==========================================
  # 3. REAL-TIME OLAP DATABASE (ClickHouse)
  # ==========================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hpc-clickhouse
    ports:
      - "8123:8123" # HTTP port (For Grafana connection)
      - "9000:9000" # Native port (For Flink Sink connection)
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=adminpassword
      - CLICKHOUSE_DB=hpc_monitor
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  # ==========================================
  # 4. DATA LAKEHOUSE STAGING (MinIO)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: hpc-minio
    ports:
      - "9001:9001" # MinIO Console UI
      - "9005:9000" # MinIO API (Mapped to 9005 on host to avoid conflict with ClickHouse)
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ==========================================
  # 5. DATA VISUALIZATION (Grafana)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: hpc-grafana
    ports:
      - "3000:3000" # Grafana Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse
    volumes:
      - grafana-data:/var/lib/grafana

  # ==========================================
  # 7. NEAR-REALTIME PROCESSING (PySpark)
  # ==========================================
  spark-consumer:
    image: jupyter/pyspark-notebook:latest
    container_name: hpc-spark-consumer
    depends_on:
      - minio
    environment:
      # PySpark now reads from MinIO (Bronze Layer) instead of Kafka
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=adminpassword
      - MINIO_ENDPOINT=http://minio:9000
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -lc "pip install -r requirements.txt && python ingestion/spark_consumer.py"

volumes:
  clickhouse-data:
  minio-data:
  grafana-data: