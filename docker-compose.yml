services:
  # ==========================================
  # 1. MESSAGE QUEUE (Apache Kafka KRaft Mode)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hpc-kafka
    ports:
      - "9092:9092"
    environment:
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  # ==========================================
  # 2. STREAM PROCESSING (Apache Flink Cluster)
  # ==========================================
  jobmanager:
    build:
      context: .
      dockerfile: stream_processing/Dockerfile.flink
    container_name: flink-jobmanager
    ports:
      - "8081:8081" # Flink Web UI
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./stream_processing:/opt/flink/usrlib
    depends_on:
      - kafka
      - clickhouse

  taskmanager:
    build:
      context: .
      dockerfile: stream_processing/Dockerfile.flink
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 2 # Scale to 2 instances to simulate distributed processing
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4 # 4 slots per TaskManager
    volumes:
      - ./stream_processing:/opt/flink/usrlib

  # ==========================================
  # 3. REAL-TIME OLAP DATABASE (ClickHouse)
  # ==========================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hpc-clickhouse
    ports:
      - "8123:8123" # HTTP port (For Grafana connection)
      - "9000:9000" # Native port (For Flink Sink connection)
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=adminpassword
      - CLICKHOUSE_DB=hpc_monitor
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  # ==========================================
  # 4. DATA LAKEHOUSE STAGING (MinIO)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: hpc-minio
    ports:
      - "9001:9001" # MinIO Console UI
      - "9005:9000" # MinIO API (Mapped to 9005 on host to avoid conflict with ClickHouse)
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ==========================================
  # 5. DATA VISUALIZATION (Grafana)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: hpc-grafana
    ports:
      - "3000:3000" # Grafana Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse
    volumes:
      - grafana-data:/var/lib/grafana

  # ==========================================
  # 6. TELEMETRY COLLECTOR (Telegraf)
  # ==========================================
  telegraf:
    image: telegraf:1.39.2
    container_name: hpc-telegraf
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
    volumes:
      - ./ingestion/telegraf-hpc.conf:/etc/telegraf/telegraf.conf:ro
    command: ["--config", "/etc/telegraf/telegraf.conf"]

  # ==========================================
  # 7. IOT DATA PRODUCER
  # ==========================================
  iot-producer:
    build: .
    container_name: hpc-iot-producer
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092

  # ==========================================
  # 8. NEAR-REALTIME PROCESSING (PySpark)
  # ==========================================
  spark-consumer:
    image: jupyter/pyspark-notebook:latest
    container_name: hpc-spark-consumer
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -lc "pip install -r requirements.txt && python ingestion/spark_consumer.py"

  # ==========================================
  # 9. KAFKA MIRROR MAKER 2 (Sync from 3 remote machines)
  # ==========================================
  mirrormaker2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hpc-mirrormaker2
    depends_on:
      - kafka
    volumes:
      - ./mm2.properties:/tmp/mm2.properties
    command: /opt/kafka/bin/connect-mirror-maker.sh /tmp/mm2.properties

volumes:
  clickhouse-data:
  minio-data:
  grafana-data: