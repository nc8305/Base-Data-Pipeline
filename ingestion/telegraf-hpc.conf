# Telegraf Configuration for HPC Metrics Collection
# This configuration collects system metrics from a Windows client
# in a high-performance computing (HPC) environment and sends them
# to a Kafka topic for further processing.

# Label the metrics with global tags for cluster and node identification
[global_tags]
  cluster = "hpc-local-poc"
  node_name = "windows-client-1"

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "5s"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  interfaces = ["eth0", "Wi-Fi"]

[[outputs.kafka]]
  brokers = ["127.0.0.1:9092"]
  topic = "hpc-raw-metrics"
  data_format = "json"
  json_timestamp_units = "1ms"