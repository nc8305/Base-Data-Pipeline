# =====================================================================
# TELEGRAF CONFIGURATION FOR HPC METRICS & LOGS COLLECTION
# ---------------------------------------------------------------------
# This configuration collects system metrics, hardware telemetry (power/temp),
# unstructured event logs, and containerized workloads from a Windows client.
# It acts as an aggressive producer, sending high-cardinality JSON data 
# to a Kafka topic (Bronze Layer) for Medallion Architecture processing.
# =====================================================================

# ---------------------------------------------------------------------
# GLOBAL TAGS: Applied to every single JSON payload
# ---------------------------------------------------------------------
[global_tags]
  cluster = "hpc-local-poc"
  node_name = "windows-client-1"
  datacenter = "vn-hcm-zone-1"       # Added for routing/enrichment logic
  environment = "production"

# ---------------------------------------------------------------------
# AGENT CONFIGURATION: Optimized for Network Backpressure
# ---------------------------------------------------------------------
[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  
  # Optimization: Changed flush_interval and added jitter to prevent 
  # network storms when scaling to thousands of nodes.
  flush_interval = "10s"             
  flush_jitter = "3s"                

# =====================================================================
# 1. STANDARD INFRASTRUCTURE METRICS (The Basics)
# =====================================================================
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  interfaces = ["eth0", "Wi-Fi"]


# =====================================================================
# 2. HARDWARE TELEMETRY: Power & Temperature (HPE-style Monitoring)
# Note: Native Windows does not expose raw hardware sensors easily. 
# We use WMI/Performance Counters to fetch ACPI Thermal Zones & Power.
# =====================================================================
[[inputs.win_perf_counters]]
  # Fetch Temperature from Windows Thermal Zones
  [[inputs.win_perf_counters.object]]
    ObjectName = "Thermal Zone Information"
    Instances = ["*"]
    Counters = ["Temperature"]
    Measurement = "hw_temperature"
  
  # Fetch Power Consumption (If supported by motherboard/laptop battery)
  [[inputs.win_perf_counters.object]]
    ObjectName = "Power Meter"
    Instances = ["*"]
    Counters = ["Power"]
    Measurement = "hw_power"


# =====================================================================
# 3. WORKLOAD MANAGER SIMULATION (Cardinality Explosion)
# Collects exact resource usage (CPU, RAM, Net) of every running Job.
# This forces the Stream Engine to handle dynamic, deep-nested tags.
# =====================================================================
[[inputs.docker]]
  endpoint = "npipe:////./pipe/docker_engine"
  gather_services = false
  source_tag = false
  timeout = "5s"
  container_name_include = []
  container_name_exclude = []

# =====================================================================
# 4. SYSTEM LOGS & EVENTS (The Unstructured Text Bomb)
# Injects pure text into the data stream, forcing the downstream 
# ETL pipeline (Spark/Flink) to perform Regex parsing on the fly.
# =====================================================================
[[inputs.win_eventlog]]
  locale = 1033
  
  # Sử dụng XPath Query chuẩn của Microsoft để lọc Log
  xpath_query = '''
  <QueryList>
    <Query Id="0" Path="System">
      <Select Path="System">*[System[(Level=2 or Level=3)]]</Select>
    </Query>
    <Query Id="1" Path="Application">
      <Select Path="Application">*[System[(Level=2 or Level=3)]]</Select>
    </Query>
  </QueryList>
  '''


# =====================================================================
# 5. MICRO-METRICS: High-resolution process tracking
# =====================================================================
[[inputs.procstat]]
  # Regex to catch core heavy processes
  pattern = ".*(chrome|Code|telegraf|docker|vmmem).*" 
  pid_finder = "native"


# =====================================================================
# OUTPUT: KAFKA BRONZE LAYER SINK
# =====================================================================
[[outputs.kafka]]
  brokers = ["127.0.0.1:9092"]
  topic = "hpc-raw-metrics"
  data_format = "json"
  json_timestamp_units = "1ms"